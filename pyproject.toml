[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-key-detector"
version = "0.1.0"
description = "Realtime tonal-center probability estimator on a continuous chroma cycle"
authors = [{ name = "Thomas Pan" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["audio", "music", "signal-processing", "realtime", "tonality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "sounddevice>=0.4",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "black>=23.0",
  "ruff>=0.3",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
